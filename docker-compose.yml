services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3003}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ENABLE_CHATBOT: ${NEXT_PUBLIC_ENABLE_CHATBOT:-true}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      HOME: /home/node
    volumes:
      - blevin_data:/app/data
      - codex_home:/home/node/.codex
      - chat_sessions:/tmp/blevin_chat_sessions
    # Resume tailor sidecar runs on the host (Python service in
    # ai-assistant). Expose host.docker.internal so the api route can
    # reach it from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  blevin_data:
  codex_home:
  chat_sessions:
