<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Chart-analysis evaluation workflow</title><desc id="desc">A schematic of the comparison and review approach. It is not a measured performance chart or a claim of completed clinical validation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker></defs><rect width="760" height="650" rx="18" fill="#0b0d16"/><text x="380" y="42" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="25" font-weight="bold">A reviewable chart-analysis comparison</text><rect x="40" y="76" width="680" height="88" rx="12" fill="#111827" stroke="#334155"/><text x="380" y="108" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="23" font-weight="bold">Comparable inputs</text><text x="380" y="140" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="19">Existing and candidate reports from the same chart</text><path d="M380 168V197" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="204" width="680" height="88" rx="12" fill="#111827" stroke="#334155"/><text x="380" y="236" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="23" font-weight="bold">Evidence review</text><text x="380" y="268" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="19">Inspect support, omissions, consistency and cost</text><path d="M380 296V325" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="332" width="680" height="88" rx="12" fill="#111827" stroke="#334155"/><text x="380" y="364" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="23" font-weight="bold">Independent review</text><text x="380" y="396" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="19">Blinded clinician review remains a validation gate</text><path d="M380 424V453" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="460" width="680" height="88" rx="12" fill="#111827" stroke="#334155"/><text x="380" y="492" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="23" font-weight="bold">Product decision</text><text x="380" y="524" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="19">Promote only after the required review</text><text x="380" y="614" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="17">Approach schematic · no patient data or quantitative clinical claim</text></svg>