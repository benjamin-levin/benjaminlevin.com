<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">From chain events to an operator decision</title><desc id="desc">Illustrative architecture schematic • team data path and terminal. Ingest: Solana → Jetstreamer decoders; Land + resume: ClickHouse + backfill checkpoints; Transform + serve: ETL → TimescaleDB → DAL / RPC; Inspect + simulate: Trading UI → simulation gate. My scope spans the terminal, initial labeling work and selected data-path improvements. No throughput benchmark shown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7dd3fc" stroke-width="1.5"/></marker></defs><rect width="1200" height="500" rx="22" fill="#0b1220"/><text x="42" y="62" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="30" font-weight="700">From chain events to an operator decision</text><text x="42" y="99" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Illustrative architecture schematic • team data path and terminal</text><rect x="42" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="60" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Ingest</text><text x="60" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Solana → Jetstreamer</text><text x="60" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">decoders</text><path d="M304 244H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="328" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="346" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Land + resume</text><text x="346" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">ClickHouse + backfill</text><text x="346" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">checkpoints</text><path d="M590 244H608" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="614" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="632" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Transform + serve</text><text x="632" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">ETL → TimescaleDB → DAL /</text><text x="632" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">RPC</text><path d="M876 244H894" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="918" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Inspect + simulate</text><text x="918" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Trading UI → simulation</text><text x="918" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">gate</text><text x="42" y="391" fill="#b6c5d8" font-family="Arial,sans-serif" font-size="18">My scope spans the terminal, initial labeling work and selected data-path improvements. No throughput</text><text x="42" y="419" fill="#b6c5d8" font-family="Arial,sans-serif" font-size="18">benchmark shown.</text></svg>
