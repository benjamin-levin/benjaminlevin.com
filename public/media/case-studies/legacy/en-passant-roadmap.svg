<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Motion and sensing: prototype to research direction</title><desc id="desc">Illustrative roadmap • completed and proposed work are distinguished. Stage 1 · prototype: CoreXY magnetic cart + capacitive array; Stage 2 · planned: Linear motors + absolute encoders; Stage 3 · R&amp;D: PCB coils for motion + sensing; Project paused: Unified PCB layout still in progress. Arrows show the design roadmap, not completed transitions. Shared-coil closed-loop control remained a research concept.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7dd3fc" stroke-width="1.5"/></marker></defs><rect width="1200" height="500" rx="22" fill="#0b1220"/><text x="42" y="62" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="30" font-weight="700">Motion and sensing: prototype to research direction</text><text x="42" y="99" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Illustrative roadmap • completed and proposed work are distinguished</text><rect x="42" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="60" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Stage 1 · prototype</text><text x="60" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">CoreXY magnetic cart +</text><text x="60" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">capacitive array</text><path d="M304 244H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="328" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="346" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Stage 2 · planned</text><text x="346" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Linear motors + absolute</text><text x="346" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">encoders</text><path d="M590 244H608" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="614" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="632" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Stage 3 · R&amp;D</text><text x="632" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">PCB coils for motion +</text><text x="632" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">sensing</text><path d="M876 244H894" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="918" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Project paused</text><text x="918" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Unified PCB layout still</text><text x="918" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">in progress</text><text x="42" y="391" fill="#b6c5d8" font-family="Arial,sans-serif" font-size="18">Arrows show the design roadmap, not completed transitions. Shared-coil closed-loop control remained a</text><text x="42" y="419" fill="#b6c5d8" font-family="Arial,sans-serif" font-size="18">research concept.</text></svg>
