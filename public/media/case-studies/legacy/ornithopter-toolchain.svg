<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Geometry design becomes a runtime wing profile</title><desc id="desc">Illustrative mechanism schematic • shoulder subsystem workflow. Optimize geometry: PSO searches linkage parameters; Solve kinematics: Lookup surface over motor + trim angle; Choose a profile: Target AoA → path → cyclic fit; Run on hardware: Exported header + encoder interpolation. Mechanical geometry is selected offline; the trim profile is evaluated at runtime. No measured lift or convergence data shown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7dd3fc" stroke-width="1.5"/></marker></defs><rect width="1200" height="500" rx="22" fill="#0b1220"/><text x="42" y="62" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="30" font-weight="700">Geometry design becomes a runtime wing profile</text><text x="42" y="99" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Illustrative mechanism schematic • shoulder subsystem workflow</text><rect x="42" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="60" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Optimize geometry</text><text x="60" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">PSO searches linkage</text><text x="60" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">parameters</text><path d="M304 244H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="328" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="346" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Solve kinematics</text><text x="346" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Lookup surface over motor</text><text x="346" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">+ trim angle</text><path d="M590 244H608" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="614" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="632" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Choose a profile</text><text x="632" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Target AoA → path →</text><text x="632" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">cyclic fit</text><path d="M876 244H894" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="167" width="258" height="155" rx="14" fill="#132238" stroke="#35516f"/><text x="918" y="207" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Run on hardware</text><text x="918" y="242" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">Exported header + encoder</text><text x="918" y="267" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17">interpolation</text><text x="42" y="391" fill="#b6c5d8" font-family="Arial,sans-serif" font-size="18">Mechanical geometry is selected offline; the trim profile is evaluated at runtime. No measured lift or</text><text x="42" y="419" fill="#b6c5d8" font-family="Arial,sans-serif" font-size="18">convergence data shown.</text></svg>
