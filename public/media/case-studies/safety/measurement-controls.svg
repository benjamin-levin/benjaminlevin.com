<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">From a separable representation to a useful safety claim</title><desc id="desc">A probe reads activations to rank a labeled contrast. Cross-task evaluation and controls test competing explanations. Causal control remains a separate proposed experiment.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#567078"/></marker></defs>
<rect width="1200" height="440" fill="#fbf8f1"/>
<g font-family="Arial,sans-serif" fill="#152f38"><text x="36" y="43" font-size="25" font-weight="bold">A direction is a measurement, not yet an explanation</text>
<g fill="#e5eeed" stroke="#aec8c7"><rect x="36" y="82" width="250" height="118" rx="12"/><rect x="325" y="82" width="250" height="118" rx="12"/><rect x="614" y="82" width="250" height="118" rx="12"/></g>
<rect x="903" y="82" width="260" height="118" rx="12" fill="#f0e9dd" stroke="#c7bca8" stroke-dasharray="6 5"/>
<g font-size="20" font-weight="bold"><text x="54" y="116">1 · Define the contrast</text><text x="343" y="116">2 · Fit on source only</text><text x="632" y="116">3 · Transfer unchanged</text><text x="921" y="116">4 · Test causal effects</text></g>
<g font-size="17"><text x="54" y="150">What does the label mean?</text><text x="54" y="177">Intent, falsity, or harmfulness?</text><text x="343" y="150">Hidden states → linear score</text><text x="343" y="177">Train-fold standardization</text><text x="632" y="150">New task or category</text><text x="632" y="177">Check ranking and reversals</text><text x="921" y="150">Predicted behavior changes?</text><text x="921" y="177">Separate future experiment</text></g>
<g stroke="#567078" stroke-width="2" marker-end="url(#arrow)"><path d="M290 140H318"/><path d="M579 140H607"/><path d="M869 140H896"/></g>
<text x="36" y="250" font-size="21" font-weight="bold">Controls ask what else could explain the score</text>
<g font-size="18"><text x="36" y="289">Framing</text><text x="36" y="318" fill="#52676e">Same statement, different context</text><text x="438" y="289">Source / register</text><text x="438" y="318" fill="#52676e">Same-corpus harmless examples</text><text x="841" y="289">Behavioral meaning</text><text x="841" y="318" fill="#52676e">Harm labels ≠ observed refusal</text><text x="36" y="368">Structural null</text><text x="36" y="397" fill="#52676e">Identical tokens → identical embeddings</text><text x="438" y="368">Selection fairness</text><text x="438" y="397" fill="#52676e">No target labels to choose a layer</text><text x="841" y="368">Token count</text><text x="841" y="397" fill="#52676e">Equalize sampled positions</text></g></g></svg>
