<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img"><title>Speculation must restore both kinds of history</title><rect width="1080" height="430" rx="16" fill="#f8fafb"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087f8c"/></marker></defs><text x="35" y="46" font-family="sans-serif" font-size="25" font-weight="bold" fill="#172b36">Speculation must restore both kinds of history</text><text x="35" y="130" font-family="sans-serif" font-size="17" fill="#344054">Attention KV</text><rect x="210" y="100" width="240" height="78" rx="10" fill="#e0eaee"/><text x="330" y="129" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">Verify draft</text><path d="M456 139h26" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="100" width="240" height="78" rx="10" fill="#d8efed"/><text x="610" y="129" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">Truncate rejected</text><text x="610" y="152" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">cache positions</text><path d="M736 139h26" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><rect x="770" y="100" width="240" height="78" rx="10" fill="#e0eaee"/><text x="890" y="129" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">Commit accepted</text><text x="890" y="152" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">positions</text><text x="35" y="255" font-family="sans-serif" font-size="17" fill="#344054">Recurrent state</text><rect x="210" y="225" width="240" height="78" rx="10" fill="#e0eaee"/><text x="330" y="254" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">Snapshot, then verify</text><path d="M456 264h26" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="225" width="240" height="78" rx="10" fill="#d8efed"/><text x="610" y="254" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">Restore snapshot</text><text x="610" y="277" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">after rejection</text><path d="M736 264h26" stroke="#087f8c" stroke-width="2" marker-end="url(#a)"/><rect x="770" y="225" width="240" height="78" rx="10" fill="#e0eaee"/><text x="890" y="254" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">Re-forward accepted</text><text x="890" y="277" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172b36">prefix tokens</text><text x="35" y="395" font-family="sans-serif" font-size="16" fill="#526673">Mechanism illustration · recurrent updates cannot be undone by changing an attention-cache offset</text></svg>