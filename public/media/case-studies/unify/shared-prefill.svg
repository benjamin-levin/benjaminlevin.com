<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img"><title>Several roles. One computed conversation trunk.</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="560" rx="18" fill="#f5f7fb"/><text x="38" y="52" font-family="sans-serif" font-size="27" font-weight="700" fill="#14243a">Several roles. One computed conversation trunk.</text><text x="38" y="84" font-family="sans-serif" font-size="16" fill="#516078">Mechanism schematic · branch widths and positions do not represent measured cost.</text><path d="M390 220 L495 165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M390 265 L495 295" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M390 310 L495 425" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M745 165 L820 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M745 295 L820 305" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M745 425 L820 335" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="180" width="350" height="170" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="58" y="210" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Shared prefill</text><text x="58" y="235" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Conversation + utterance</text><text x="58" y="260" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Relevant tool evidence</text><text x="58" y="285" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">One target-model weight set</text><rect x="495" y="120" width="250" height="90" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="513" y="150" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Planner branch</text><text x="513" y="175" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Role directive + delta</text><rect x="495" y="250" width="250" height="90" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="513" y="280" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Thinker branch</text><text x="513" y="305" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Role directive + delta</text><rect x="495" y="380" width="250" height="90" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="513" y="410" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Speaker branch</text><text x="513" y="435" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Role directive + delta</text><rect x="820" y="250" width="220" height="110" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="838" y="280" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Commit or discard</text><text x="838" y="305" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Promote valid state</text><text x="838" y="330" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Drop stale branches</text><text x="38" y="526" font-family="sans-serif" font-size="15" fill="#516078">Exact consumed-prefix match permits continuation. A mismatch takes an explicit cold path.</text></svg>