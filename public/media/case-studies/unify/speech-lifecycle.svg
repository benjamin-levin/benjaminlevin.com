<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img"><title>A reply becomes speech one coherent unit at a time.</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="560" rx="18" fill="#f5f7fb"/><text x="38" y="52" font-family="sans-serif" font-size="27" font-weight="700" fill="#14243a">A reply becomes speech one coherent unit at a time.</text><text x="38" y="84" font-family="sans-serif" font-size="16" fill="#516078">Mechanism schematic · no invented audio waveform or timing scale.</text><path d="M270 215 L330 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M550 215 L610 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M810 215 L850 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570 365 L710 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="150" width="230" height="130" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="58" y="180" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Streamed text</text><text x="58" y="205" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Find clause / sentence</text><text x="58" y="230" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Respect brackets, URLs,</text><text x="58" y="255" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">numbers and abbreviations</text><rect x="330" y="150" width="220" height="130" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="348" y="180" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Synthesis units</text><text x="348" y="205" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">First coherent clause</text><text x="348" y="230" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Then sentence grouping</text><text x="348" y="255" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Bound run-on output</text><rect x="610" y="150" width="200" height="130" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="628" y="180" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Prepared clips</text><text x="628" y="205" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Trim + edge fades</text><text x="628" y="230" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Boundary-aware joins</text><text x="628" y="255" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Queue playback</text><rect x="850" y="150" width="190" height="130" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="868" y="180" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Heard history</text><text x="868" y="205" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Commit delivered text</text><text x="868" y="230" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Track interrupted</text><text x="868" y="255" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">reply separately</text><rect x="330" y="365" width="480" height="95" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="348" y="395" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Independent audio-side interruption</text><text x="348" y="420" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Cut playback, queued audio and prefetched audio</text><text x="38" y="526" font-family="sans-serif" font-size="15" fill="#516078">A crossfade cannot reliably repair phrasing generated from an incoherent fragment.</text></svg>