<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img"><title>Memory has both a steady state and a transition cost.</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1080" height="560" rx="18" fill="#f5f7fb"/><text x="38" y="52" font-family="sans-serif" font-size="27" font-weight="700" fill="#14243a">Memory has both a steady state and a transition cost.</text><text x="38" y="84" font-family="sans-serif" font-size="16" fill="#516078">Mechanism schematic · allocation sizes are illustrative, not to scale.</text><path d="M265 325 L265 265" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M815 265 L815 325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="130" width="450" height="135" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="58" y="160" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Recurrent rollback pool</text><text x="58" y="185" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Separate live state for every role</text><text x="58" y="210" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">One rollback window lent to the drafting role</text><text x="58" y="235" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Settle pending rollback before handing it off</text><rect x="590" y="130" width="450" height="135" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="608" y="160" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Elastic attention KV</text><text x="608" y="185" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Commit a smaller context tier first</text><text x="608" y="210" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Grow between active decode steps</text><text x="608" y="235" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Retain the working context during migration</text><rect x="40" y="325" width="450" height="120" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="58" y="355" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Old per-sequence layout</text><text x="58" y="380" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Live A + rollback A</text><text x="58" y="405" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Live B + rollback B + …</text><rect x="590" y="325" width="450" height="120" rx="12" fill="white" stroke="#b4c9d9" stroke-width="2"/><text x="608" y="355" font-family="sans-serif" font-size="18" font-weight="700" fill="#14243a">Growth preflight</text><text x="608" y="380" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Old allocation + new allocation + reserve</text><text x="608" y="405" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Choose Direct / Grouped / Staged</text><text x="608" y="430" font-family="sans-serif" font-size="16" font-weight="400" fill="#14243a">Check device and host headroom</text><text x="38" y="526" font-family="sans-serif" font-size="15" fill="#516078">VMM is a separate backing candidate; mapping and allocator behavior require device-specific qualification.</text></svg>